plugins { id 'com.android.application' }

android {
    namespace 'com.studywithfriendly.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.studywithfriendly.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets { main.assets.srcDirs += "$buildDir/generated/webAssets" }
}

tasks.register('copyWebAssets', Copy) {
    from('../..') {
        include 'index.html', 'styles.css', 'app.js', 'manifest.webmanifest', 'sw.js'
        include 'icons/**'
    }
    into "$buildDir/generated/webAssets"
}
preBuild.dependsOn(copyWebAssets)
